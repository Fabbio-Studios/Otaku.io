{% extends 'modelo.html' %}
{% load static %}

{% block titulo %}
<title>Solicitar Obra - Otaku Estudante</title>
{% endblock %}

{% block conteudo %}
    <section class="content-nb container-nb py-8">
        <div class="max-w-lg mx-auto">
            <div class="mb-6">
                <h1 class="text-4xl font-black uppercase mb-1">Solicitar Obra</h1>
                <p class="text-xl font-bold">Não encontrou a obra? Solicite para a comunidade</p>
            </div>

            <div class="card-nb p-8 shadow-nb">
                <form method="post">
                    {% csrf_token %}

                    <div class="form-group-nb">
                        <label for="id_titulo">Título da Obra</label>
                        <input type="text" name="titulo" class="input-nb w-full" maxlength="200" required id="id_titulo" placeholder="Digite o título da obra">
                    </div>

                    {{ form.non_field_errors }}

                    <button type="submit" class="btn-primary w-full py-3 text-lg font-black">
                        <i class="fas fa-paper-plane mr-2"></i>Enviar Solicitação
                    </button>
                </form>
            </div>
        </div>
    </section>
{% endblock %}
