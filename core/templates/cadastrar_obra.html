{% extends 'modelo.html' %}
{% load static %}

{% block titulo %}
<title>Cadastrar Obra - Otaku Estudante</title>
{% endblock %}

{% block conteudo %}
    <section class="content-nb container-nb py-8">
        <div class="max-w-lg mx-auto">
            <!-- Header -->
            <div class="mb-6">
                <h1 class="text-4xl font-black uppercase mb-1">Cadastrar Nova Obra</h1>
                <p class="text-xl font-bold">Adicione uma nova obra ao catálogo</p>
            </div>

            <div class="card-nb p-8 shadow-nb">
                <form method="POST" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="form-group-nb">
                        <label for="titulo">Título da Obra</label>
                        {{ form.titulo }}
                    </div>

                    <div class="form-group-nb">
                        <label class="block mb-2">Capa da Obra</label>
                        <div class="upload-area flex flex-col items-center mb-4">
                            <label for="fileInput" class="upload-rectangle group relative cursor-pointer">
                                <img id="previewImage" 
                                     src="{% static 'img/default-avatar.png' %}" 
                                     alt="Preview da Capa" 
                                     class="preview-image w-full h-full object-cover border-black border-3 hidden">
                                <span id="message" class="message text-black font-black text-center">Selecionar Capa</span>
                            </label>
                            <input 
                                type="file" 
                                id="fileInput" 
                                name="capa" 
                                accept="image/*" 
                                onchange="showPreview(event)" 
                                hidden 
                                required>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-full py-3 text-lg font-black">
                        <i class="fas fa-plus-circle mr-2"></i>Cadastrar Obra
                    </button>
                </form>
            </div>
        </div>
    </section>

    <script>
        function showPreview(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('previewImage');
            const message = document.getElementById('message');

            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    message.classList.add('hidden');
                };
                reader.readAsDataURL(file);
            } else {
                preview.classList.add('hidden');
                message.classList.remove('hidden');
            }
        }
    </script>

    <style>
        .upload-area {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-rectangle {
            width: 100%;
            max-width: 300px;
            height: 300px;
            background-color: #f0f0f0;
            border: 4px dashed #000;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: var(--transition-fast);
        }

        .upload-rectangle:hover {
            background-color: #e0e0e0;
            border-color: var(--color-primary);
        }

        .preview-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .message {
            color: #000;
            font-size: 1rem;
            text-align: center;
            font-weight: 900;
        }
    </style>
{% endblock %}
