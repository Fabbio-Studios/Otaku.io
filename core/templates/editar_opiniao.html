{% extends 'modelo.html' %}
{% load static %}

{% block titulo %}
<title>Editar Opinião - Otaku Estudante</title>
{% endblock %}

{% block conteudo %}
    <section class="content-nb container-nb py-8">
        <div class="max-w-lg mx-auto">
            <div class="mb-6">
                <h1 class="text-3xl font-black uppercase mb-1">Editar Opinião</h1>
                <p class="text-lg font-bold">"{{ opiniao.obra.titulo }}"</p>
            </div>

            <div class="card-nb p-8 shadow-nb">
                <form method="POST" class="space-y-4">
                    {% csrf_token %}
                    <div class="form-group-nb">
                        <label for="texto">Sua opinião:</label>
                        <textarea id="texto" name="texto" rows="5" class="input-nb w-full" required style="resize: vertical;">{{ opiniao.texto }}</textarea>
                    </div>
                    <button type="submit" class="btn-primary w-full py-3 font-black">
                        <i class="fas fa-save mr-2"></i>Atualizar Opinião
                    </button>
                </form>
                <div class="mt-4 text-center">
                    <a href="{% url 'detalhes_obra' opiniao.obra.titulo %}" class="btn-nb bg-yellow-200 text-yellow-900">
                        <i class="fas fa-times mr-2"></i>Cancelar
                    </a>
                </div>
            </div>
        </div>
    </section>
{% endblock %}
