{% extends 'modelo.html' %}
{% load static %}

{% block titulo %}
<title>Excluir Obra - Otaku Estudante</title>
{% endblock %}

{% block conteudo %}
    <section class="content-nb container-nb py-8">
        <div class="max-w-md mx-auto">
            <div class="text-center mb-8">
                <div class="w-16 h-16 bg-red-100 border-black border-3 rounded-sm flex items-center justify-center mx-auto mb-4 shadow-nb">
                    <i class="fas fa-exclamation-triangle text-3xl text-red-900"></i>
                </div>
                <h1 class="text-3xl font-black uppercase mb-2">Excluir Obra</h1>
                <p class="text-xl font-bold">Tem certeza que deseja excluir "<strong>{{ obra.titulo }}</strong>"?</p>
                <p class="text-lg font-bold text-red-900">Esta ação não pode ser desfeita.</p>
            </div>

            <div class="card-nb p-8 shadow-nb text-center">
                <form method="POST" class="inline-block">
                    {% csrf_token %}
                    <button type="submit" class="btn-nb bg-red-200 text-red-900 px-8 py-3 font-black text-lg">
                        <i class="fas fa-trash mr-2"></i>Sim, Excluir
                    </button>
                </form>
                <a href="{% url 'listar_obras' %}" class="btn-nb ml-4 px-8 py-3 font-black text-lg bg-yellow-200 text-yellow-900">
                    <i class="fas fa-times mr-2"></i>Cancelar
                </a>
            </div>
        </div>
    </section>
{% endblock %}
